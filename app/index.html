<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GLP-1 plotter</title>
    <meta name="description" content="Plot the estimated amount of a GLP-1 medication in your body over a titration plan, including tirzepatide KwikPen clicks." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0e11" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Added to the iPhone home screen: opens full screen, named "GLP-1", with a black status bar above the page. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GLP-1" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Anonymous visit count (GoatCounter site "glp1": no cookies, totals only). no_onload: App.tsx counts once, as "/",
         after it has stripped the URL's query and hash, so nothing from a link is sent. Skips localhost. -->
    <script>window.goatcounter = { no_onload: true }</script>
    <script data-goatcounter="https://glp1.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
