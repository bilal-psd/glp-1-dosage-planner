<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option B: Pens</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Azeret+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff2;--surface:#ffffff;--ink:#1c2330;--muted:#5a6474;--rule:#cfd6de;--track:#dde2e8;--curve:#2a4f86;--over:#c2410c;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;
 --vz-line:var(--curve);--vz-grid:var(--track);--vz-muted:var(--muted);--vz-surface:var(--surface);--vz-tip-bg:var(--ink);--vz-tip-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--surface:#1b2129;--ink:#e4e9f0;--muted:#9aa4b1;--rule:#2e3743;--track:#28313c;--curve:#7fa6e0;--over:#f08a4b;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--vz-tip-ink:#12161c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 "Onest",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between;margin-bottom:20px}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em}
.settings{display:flex;flex-wrap:wrap;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8125rem;color:var(--muted)}
input,select{font:500 1rem "Onest",sans-serif;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=number]{width:5rem}
:focus-visible{outline:3px solid var(--curve);outline-offset:2px}
.panel{background:var(--surface);border-radius:14px;padding:20px 20px 36px}
.panel h2{margin:0 0 16px;font-size:1rem;font-weight:500;color:var(--muted)}
.panel h2 b{color:var(--ink);font-weight:700}
.penhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:40px 0 12px}
.penhead h2{margin:0;font-size:1.25rem}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:1rem;color:var(--ink)}
/* the pen, drawn to scale: each dose is a segment, width = its clicks */
.pen{margin:0 0 8px}
.penbody{display:flex;align-items:center;height:56px}
.cap{width:46px;height:40px;border-radius:20px 4px 4px 20px;background:var(--rule)}
.barrel{flex:1;height:48px;margin-left:3px;border-radius:6px;background:var(--track);display:flex;gap:2px;padding:4px;overflow:hidden;position:relative}
.seg{height:100%;border-radius:3px;background:var(--hue)}
.seg.first{margin-left:6px}
.empty{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.barrel{overflow:visible}
.seg.over{background:repeating-linear-gradient(135deg,var(--over) 0 5px,transparent 5px 9px)}
.knob{width:22px;height:30px;margin-left:3px;border-radius:4px 10px 10px 4px;background:var(--rule)}
.penmeta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:8px 49px 0;font-size:.875rem;color:var(--muted)}
.penmeta b{color:var(--ink)}
.penmeta .warn{color:var(--over);font-weight:500}
.strength{display:flex;align-items:center;gap:10px}
.swatch{width:14px;height:14px;border-radius:50%;background:var(--hue)}
.steps{margin:18px 0 0;border-top:1px solid var(--rule)}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:10px 18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule)}
/* dose window, like the one on the pen */
.window{font:700 2rem/1 "Azeret Mono",monospace;background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;min-width:4.2ch;text-align:right;position:relative}
.window::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:var(--ink)}
.dial{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.dial p{grid-column:1/-1;margin:0;font-size:1rem}.dial p span{color:var(--muted)}
.dial input[type=range]{width:100%;accent-color:var(--hue);height:28px;padding:0;border:0;background:none}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-size:1.25rem;cursor:pointer}
.when{text-align:right;font-size:.875rem;color:var(--muted)}
.when input{width:4.5rem;margin-top:4px}
.btn{font:500 1rem "Onest",sans-serif;padding:9px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.linkish{font:500 .875rem "Onest",sans-serif;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0}
.row-actions{display:flex;gap:10px;margin-top:14px}
@media (max-width:640px){.step{grid-template-columns:auto 1fr}.when{grid-column:1/-1;text-align:left;display:flex;gap:12px;align-items:end}.penmeta{padding:8px 0 0}}
</style>
<style id="vzcss"></style>
</head><body><main>
<header><h1>GLP-1 plotter</h1>
<div class="settings"><label>Medication<select id="drug"></select></label><label>Every (days)<input id="freq" type="number" min="1" step="0.5"></label><label>First dose<input id="start" type="date"></label></div></header>
<section class="panel"><h2 id="sum"></h2><div id="chart"></div></section>
<div id="pens"></div>
</main>
<script type="module">
import {DRUGS,TIRZ,CLICKS,PEN_CLICKS,STRENGTHS,loadState,compute,mg,fmtDate} from "./model.js";
import {drawChart,CHART_CSS} from "./chart.js";
document.getElementById("vzcss").textContent=CHART_CSS;
const $=id=>document.getElementById(id);
let st=loadState();
if(!st.pens?.length||st.steps.some(s=>s.pen==null)){const max=Math.max(...st.steps.map(s=>s.dose));st.pens=[{strength:STRENGTHS.find(v=>v>=max)||15}];st.steps.forEach(s=>s.pen=0)}
st.steps.forEach(s=>{if(s.clicks==null)s.clicks=Math.round(s.dose/st.pens[s.pen].strength*CLICKS)});
const hue=str=>`var(--s${STRENGTHS.indexOf(str)+1})`;
$("drug").innerHTML=Object.entries(DRUGS).map(([k,v])=>`<option value="${k}" ${k===TIRZ?"":"disabled"}>${v.name} ${v.route}${k===TIRZ?"":" (no pen clicks)"}</option>`).join("");
$("drug").value=TIRZ;st.drug=TIRZ;$("freq").value=st.freq;$("start").value=st.start;
$("freq").oninput=e=>{if(+e.target.value>0){st.freq=+e.target.value;draw()}};
$("start").oninput=e=>{st.start=e.target.value;draw()};
const sync=()=>st.steps.forEach(s=>s.dose=s.clicks*st.pens[s.pen].strength/CLICKS);
function drawChartOnly(){sync();const c=compute(st),pk=c.pts.reduce((a,b)=>b[1]>a[1]?b:a);
 $("sum").innerHTML=`Tirzepatide in your body, peaking at <b>${mg(pk[1].toFixed(2))} mg</b> on ${fmtDate(st,pk[0],{day:"numeric",month:"long"})}`;
 drawChart($("chart"),{st,pts:c.pts,events:c.events,height:240});return c}
function draw(){const {per}=drawChartOnly(),cap=PEN_CLICKS+(st.gold?CLICKS:0);
 const box=$("pens");box.innerHTML="";
 st.pens.forEach((p,pi)=>{const own=st.steps.map((s,i)=>({s,i})).filter(x=>x.s.pen===pi);
  const used=own.reduce((n,{s,i})=>n+s.clicks*per[i].length,0),left=cap-used;
  // barrel spans the pen's capacity, or the plan if it asks for more; a line marks where the pen runs dry
  const span=Math.max(cap,used);let run=0;
  const segs=own.flatMap(({s,i},k)=>per[i].map((_,j)=>{const over=run+s.clicks>cap;run+=s.clicks;return `<i class="seg${over?" over":""}${j===0&&k>0?" first":""}" style="flex:0 0 calc(${s.clicks/span*100}% - 2px)" title="Step ${i+1}: ${s.clicks} clicks"></i>`})).join("")+(used>cap?`<b class="empty" style="left:calc(4px + ${cap/span*100}% - ${cap/span*8}px)"></b>`:"");
  const el=document.createElement("section");el.style.setProperty("--hue",hue(p.strength));
  el.innerHTML=`<div class="penhead"><h2>Pen ${pi+1}</h2>
   <div class="strength"><span class="swatch"></span><label style="flex-direction:row;align-items:center;gap:8px">Strength <select data-str aria-label="Pen ${pi+1} strength">${STRENGTHS.map(v=>`<option value="${v}" ${v===p.strength?"selected":""}>${v} mg</option>`).join("")}</select></label></div>
   ${pi===0?`<label class="chk"><input type="checkbox" id="gold" ${st.gold?"checked":""}> Count the golden dose</label>`:""}</div>
  <div class="pen" role="img" aria-label="Pen ${pi+1}: ${used} of ${cap} clicks planned"><div class="penbody"><span class="cap"></span><span class="barrel">${segs}</span><span class="knob"></span></div>
  <div class="penmeta"><span><b>${used}</b> of ${cap} clicks planned</span>${left>=0?`<span>${left} clicks left, ${mg(left*p.strength/CLICKS)} mg</span>`:`<span class="warn">${-left} clicks more than this pen holds. Start a new pen.</span>`}</div></div>
  <div class="steps">${own.map(({s,i})=>`<div class="step" data-i="${i}">
   <div class="window" aria-live="polite">${s.clicks}</div>
   <div class="dial"><button class="round" data-d="-1" aria-label="One click less">−</button><input type="range" min="0" max="60" value="${s.clicks}" aria-label="Clicks for step ${i+1}"><button class="round" data-d="1" aria-label="One click more">+</button>
    <p>${s.clicks?`${s.clicks} clicks <span>= ${mg(s.dose)} mg</span>`:"0 clicks <span>= pause</span>"}</p></div>
   <div class="when"><label>Weeks<input type="number" min="1" value="${s.weeks}" data-w></label><div>${s.from===s.to?`week ${s.from}`:`weeks ${s.from}–${s.to}`}, ${fmtDate(st,(s.from-1)*7)}<br>${per[i].length} dose${per[i].length===1?"":"s"}</div></div></div>`).join("")}</div>
  <div class="row-actions"><button class="btn" data-add>Add a step to this pen</button>${st.pens.length>1?`<button class="linkish" data-rmpen>Remove pen</button>`:""}</div>`;
  el.querySelector("[data-str]").onchange=e=>{p.strength=+e.target.value;draw()};
  const g=el.querySelector("#gold");if(g)g.onchange=e=>{st.gold=e.target.checked;draw()};
  el.querySelectorAll(".step").forEach(row=>{const s=st.steps[+row.dataset.i],r=row.querySelector("[type=range]");
   const set=v=>{s.clicks=Math.min(60,Math.max(0,v));keep(()=>draw())};
   // while dragging, update the window and chart only; rebuild the pen when the drag ends
   r.oninput=()=>{s.clicks=+r.value;drawChartOnly();row.querySelector(".window").textContent=s.clicks;row.querySelector(".dial p").innerHTML=s.clicks?`${s.clicks} clicks <span>= ${mg(s.dose)} mg</span>`:"0 clicks <span>= pause</span>"};
   r.onchange=()=>set(+r.value);row.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>set(s.clicks+ +b.dataset.d));
   row.querySelector("[data-w]").oninput=e=>{if(+e.target.value>=1){s.weeks=+e.target.value;keep(()=>draw())}}});
  el.querySelector("[data-add]").onclick=()=>{const l=own.at(-1).s;st.steps.splice(st.steps.indexOf(l)+1,0,{...l,weeks:1});draw()};
  const rp=el.querySelector("[data-rmpen]");if(rp)rp.onclick=()=>{st.steps=st.steps.filter(s=>s.pen!==pi);st.steps.forEach(s=>{if(s.pen>pi)s.pen--});st.pens.splice(pi,1);draw()};
  box.appendChild(el)});
 const add=document.createElement("button");add.className="btn";add.style.marginTop="32px";add.textContent="Start a new pen";
 add.onclick=()=>{const l=st.steps.at(-1);st.pens.push({strength:st.pens[l.pen].strength});st.steps.push({...l,weeks:1,pen:st.pens.length-1});draw()};box.appendChild(add)}
// keep keyboard focus on the same control across a redraw
function keep(fn){const a=document.activeElement,row=a?.closest?.(".step"),sel=a?.dataset.w!=null?"[data-w]":a?.type==="range"?"[type=range]":a?.dataset.d?`[data-d="${a.dataset.d}"]`:null,i=row?.dataset.i;fn();if(i&&sel){const n=document.querySelector(`.step[data-i="${i}"] ${sel}`);n?.focus()}}
draw();
</script></body></html>
